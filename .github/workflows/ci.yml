name: Testes

on:
  push:
  pull_request:

jobs:
  caderneta:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caderneta
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caderneta_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: caderneta/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Testes (Postgres embutido)
        run: npm test
      - name: Testes (Postgres 16 real, como no Supabase)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/caderneta_test
