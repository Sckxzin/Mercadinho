<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070d1a">
<link rel="icon" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<title>Minha conta</title>
<link rel="stylesheet" href="/assets/ui.css?v=5">
</head>
<body>
<div class="wrap" id="app"><div class="card"><div class="sk" style="width:50%"></div><div class="sk" style="width:80%;margin-top:12px"></div></div></div>
<div id="toast"></div>
<div id="dlg"></div>
<script>
const token = location.pathname.split('/').pop();
const $ = s => document.querySelector(s);
const brl = c => (c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmt = d => new Date(d.replace(' ','T')+'Z').toLocaleDateString('pt-BR');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,ms=2800){ const t=$('#toast'); t.textContent=m; t.className='on'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.className='',ms); }
let refId = null, slugAtual = '';

async function load(){
  const [r, rx] = await Promise.all([fetch('/api/publico/'+token), fetch('/api/publico/'+token+'/extras')]);
  const el = $('#app');
  if(!r.ok){
    try{ for(const k of Object.keys(localStorage)){ if(k.startsWith('cad_token_') && localStorage.getItem(k)===token){ localStorage.removeItem(k); location.replace('/m/'+k.slice(10)); return; } } }catch(e){}
    el.innerHTML='<div class="card" style="text-align:center;margin-top:12vh"><h2>Link inválido</h2><p class="muted">Peça um novo link ou convite ao mercado.</p></div>'; return;
  }
  const d = await r.json(); slugAtual = d.slug;
  const x = rx.ok ? await rx.json() : {promocoes:[],pagamentos_informados:[],pix_disponivel:false};
  document.title = d.mercado;
  const dev = d.saldo>0, tem = d.lancamentos.length>0;
  el.innerHTML = `
    <div class="brand" style="margin:2px 0 16px"><div class="logo">${esc(d.mercado.trim()[0]||'C')}</div><div><b>${esc(d.mercado)}</b><div class="muted tiny">Olá, ${esc(d.cliente)} 👋</div></div></div>
    <div class="hero"><div class="lbl">${dev?'Você está devendo':(d.saldo<0?'Crédito na loja':'Tudo em dia 🎉')}</div>
      <div class="val ${dev?'bad':'ok'}">${brl(Math.abs(d.saldo))}</div>
      ${d.vencimento?`<div class="small ${d.vencimento.dias<=3?'amb':'muted'}" style="margin-top:6px">${d.vencimento.dias===0?'Vence <b>hoje</b>':`Vence em ${d.vencimento.data.split('-').reverse().join('/')} (${d.vencimento.dias} dia${d.vencimento.dias>1?'s':''})`}</div>`:''}
      ${dev&&x.pix_disponivel?`<button class="btn block" style="margin-top:16px" onclick="document.getElementById('pagar').scrollIntoView({behavior:'smooth'})">Pagar agora com Pix</button>`:''}</div>

    ${x.promocoes.length?`<div class="cap">Promoções</div>`+x.promocoes.map(pr=>`<div class="promo"><b>${esc(pr.titulo)}</b>
      ${pr.preco!=null?`<div style="margin-top:4px"><span class="pr">${brl(pr.preco)}</span>${pr.preco_original?`<s>${brl(pr.preco_original)}</s>`:''}</div>`:''}
      ${pr.descricao?`<div class="muted small" style="margin-top:2px">${esc(pr.descricao)}</div>`:''}
      ${pr.validade?`<div class="amb tiny" style="margin-top:6px">válida até ${pr.validade.split('-').reverse().join('/')}</div>`:''}</div>`).join(''):''}

    ${x.pix_disponivel?`<div class="cap" id="pagar">Pagar com Pix</div><div class="card">
      <label class="f" style="margin-top:0">Valor (R$)</label><input id="vp" inputmode="decimal" value="${dev?(d.saldo/100).toFixed(2).replace('.',','):''}" placeholder="0,00">
      <button class="btn block" style="margin-top:12px" onclick="gerarPix()">Gerar Pix copia e cola</button>
      <div id="pixbox" style="display:none;margin-top:12px"><div id="pixcode" class="tiny dim" style="word-break:break-all;background:#0a1224;border:1px dashed var(--line);border-radius:12px;padding:10px"></div>
        <button class="btn sec block" style="margin-top:8px" onclick="copiaPix(this)">Copiar código Pix</button><div class="hint">Cole no app do seu banco, na opção “Pix copia e cola”.</div></div>
      <div style="height:1px;background:var(--line);margin:18px 0"></div>
      <b>Já pagou? Envie o comprovante</b><div class="hint" style="margin-bottom:8px">O mercado confere e dá baixa na sua conta.</div>
      <input id="arq" type="file" accept="image/*"><button class="btn good block" style="margin-top:10px" onclick="enviaComp(this)">Enviar comprovante</button><div id="compmsg" class="small" style="margin-top:8px"></div></div>`:''}

    ${x.pagamentos_informados.length?`<div class="cap">Seus comprovantes</div><div class="card list">`+x.pagamentos_informados.map(p=>`<div class="it"><div class="main"><div class="t">${brl(p.valor)}</div><div class="s">${fmt(p.criado_em)}${p.motivo?' · '+esc(p.motivo):''}</div></div>
      <span class="chip ${p.status==='confirmado'?'ok':(p.status==='recusado'?'bad':'amb')}">${p.status==='pendente'?'Em conferência':(p.status==='confirmado'?'Confirmado ✓':'Recusado')}</span></div>`).join('')+`</div>`:''}

    <div class="cap">Histórico</div>
    <div class="card list">${tem? d.lancamentos.map(l=>`<div class="it"><div class="main"><div class="t">${l.tipo==='pagamento'?'Pagamento':(l.tipo==='compra'?'Compra':'Ajuste')} ${l.contestado?'<span class="chip bad">você avisou</span>':''}</div>
        <div class="s">${fmt(l.data)}${l.descricao?' · '+esc(l.descricao):''}</div>${l.contestado?'':`<button class="btn link" onclick="abrir(${l.id})">Algo errado nesta linha?</button>`}</div>
        <div class="amt ${l.valor<0?'ok':''}">${l.valor<0?'−':''}${brl(Math.abs(l.valor))}</div></div>`).join('')
      : '<div class="empty"><b>🧾</b>Nenhum lançamento ainda.</div>'}</div>

    <button class="btn sec block np" style="margin-top:14px" onclick="abrir(null)">Tem algo errado na minha conta?</button>
    ${tem?`<button class="btn link np" style="margin:10px auto 0;display:block" onclick="print()">Imprimir / salvar extrato em PDF</button>`:''}
    ${d.slug?`<button class="btn link" style="margin:14px auto 0;display:block" onclick="sair('${esc(d.slug)}')">Sair deste aparelho</button>`:''}
    <p class="tiny dim" style="margin-top:22px;line-height:1.6;text-align:center">Página pessoal: não compartilhe o link. Seus dados são usados apenas pelo ${esc(d.mercado)} para controle da sua conta (LGPD). Para corrigir ou apagar, fale com o mercado.</p>`;
}
async function gerarPix(){
  const v=$('#vp').value; const r=await fetch('/api/publico/'+token+'/pix?valor='+encodeURIComponent(v)); const j=await r.json();
  if(!r.ok) return toast(j.erro);
  $('#pixcode').textContent=j.copia_e_cola; $('#pixbox').style.display='block';
}
function copiaPix(b){ navigator.clipboard.writeText($('#pixcode').textContent).then(()=>{ b.textContent='Copiado ✓'; toast('Agora cole no app do seu banco'); }); }
// reduz a foto do celular antes de enviar (limite de 2 MB)
function reduz(file){ return new Promise((ok,err)=>{ const img=new Image(); img.onload=()=>{ const m=1400,k=Math.min(1,m/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=img.width*k; c.height=img.height*k; c.getContext('2d').drawImage(img,0,0,c.width,c.height); c.toBlob(b=>b?ok(b):err(new Error('Falha ao processar a imagem.')),'image/jpeg',0.82); }; img.onerror=()=>err(new Error('Esse arquivo não é uma imagem.')); img.src=URL.createObjectURL(file); }); }
async function enviaComp(btn){
  const f=$('#arq').files[0], v=$('#vp').value, msg=$('#compmsg');
  if(!f){ msg.className='small bad'; return msg.textContent='Escolha a foto ou print do comprovante.'; }
  if(!v){ msg.className='small bad'; return msg.textContent='Informe o valor pago.'; }
  btn.disabled=true; msg.className='small muted'; msg.textContent='Enviando…';
  try{
    const blob=await reduz(f);
    const r=await fetch('/api/publico/'+token+'/comprovante?valor='+encodeURIComponent(v),{method:'POST',headers:{'content-type':'image/jpeg'},body:blob});
    const j=await r.json(); if(!r.ok) throw new Error(j.erro);
    toast('Comprovante enviado! O mercado vai conferir.',3500); load();
  }catch(e){ msg.className='small bad'; msg.textContent=e.message; btn.disabled=false; }
}
function abrir(id){ refId=id;
  $('#dlg').innerHTML=`<div class="ov" onmousedown="if(event.target===this)fecha()"><div class="md"><h3>Tem algo errado?</h3><div class="muted small">${id?'Sobre o lançamento #'+id:'Mensagem sobre a sua conta'}</div>
   <label class="f">O que está errado? (opcional)</label><textarea id="msg" rows="4"></textarea><div class="acts"><button class="btn sec" onclick="fecha()">Cancelar</button><button class="btn" onclick="enviarAviso()">Avisar o mercado</button></div></div></div>`; }
function fecha(){ $('#dlg').innerHTML=''; }
async function enviarAviso(){
  const b=document.querySelector('#dlg .btn:not(.sec)'); if(b){ if(b.disabled) return; b.disabled=true; b.classList.add('carregando'); }
  await fetch('/api/publico/'+token+'/contestar',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({lancamento_id:refId,mensagem:$('#msg').value})});
  fecha(); toast('Aviso enviado. O mercado vai conferir.'); load();
}
function sair(slug){ try{ localStorage.removeItem('cad_token_'+slug); }catch(e){} location.href='/m/'+slug; }
// voltou para o app/aba: atualiza o saldo (ex.: o mercado acabou de confirmar o pagamento)
let ultimo=Date.now();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && Date.now()-ultimo>15000 && !$('#dlg').innerHTML && !$('#pixbox')?.offsetParent){ ultimo=Date.now(); load(); } });
load();
</script>
</body>
</html>
