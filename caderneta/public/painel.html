<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070d1a">
<meta name="robots" content="noindex,nofollow">
<title>Caderneta — Painel</title>
<link rel="icon" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="stylesheet" href="/assets/ui.css?v=6">
</head>
<body>
<div id="offline" role="status">Sem internet. As alterações não serão salvas até a conexão voltar.</div>
<div class="wrap wide" id="root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ====================== utilidades ====================== */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const brl = c => (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const reais = c => (c / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ini = n => String(n || '?').trim().split(/\s+/).filter(x => /^\p{L}/u.test(x)).slice(0, 2).map(x => x[0]).join('').toUpperCase() || '?';
const utc = d => new Date(String(d).replace(' ', 'T') + 'Z');
const dt = d => d ? utc(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const dataBR = iso => iso ? iso.split('-').reverse().join('/') : '';
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const loc = { get: k => { try { return localStorage.getItem(k) } catch { return null } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch {} } };
const vibra = () => { try { navigator.vibrate && navigator.vibrate(15) } catch {} };
const S = { tk: loc.get('tk'), eu: null, mercado: null, cont: {}, cl: { q: '', filtro: '', itens: [], total: 0 }, ext: null, prod: { q: '' } };
const dono = () => S.eu?.papel === 'dono';

function toast(m, tipo = '') { const t = $('#toast'); t.textContent = m; t.className = 'on ' + tipo; clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', tipo === 'erro' ? 4200 : 2600); }
const run = async fn => { try { return await fn() } catch (e) { if (e.message !== 'auth') toast(e.message || 'Algo deu errado.', 'erro') } };

/* ====================== API ====================== */
async function api(path, { method = 'GET', body, raw } = {}) {
  let r;
  try {
    r = await fetch('/api' + path, { method, headers: { ...(body ? { 'content-type': 'application/json' } : {}), authorization: 'Bearer ' + S.tk }, body: body ? JSON.stringify(body) : undefined });
  } catch { throw new Error('Sem conexão com o servidor. Verifique a internet.') }
  if (r.status === 401) { const j = await r.json().catch(() => ({})); sairLocal(j.erro || 'Sua sessão terminou. Entre novamente.'); throw new Error('auth') }
  if (raw) { if (!r.ok) throw new Error((await r.json().catch(() => ({}))).erro || 'Erro'); return r }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.erro || 'Erro'), { data: j, status: r.status });
  return j;
}
async function baixa(path) {
  const r = await api(path, { raw: true });
  const nome = (r.headers.get('content-disposition') || '').match(/filename="([^"]+)"/)?.[1] || 'arquivo';
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(await r.blob()), download: nome });
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Arquivo baixado ✓', 'ok');
}
// Abre o WhatsApp numa aba já reservada no clique (celulares bloqueiam janelas abertas depois de um "await")
async function abreWa(pegaLink) {
  const w = window.open('', '_blank');
  try { const link = await pegaLink(); if (w) w.location.href = link; else location.href = link; return true }
  catch (e) { if (w) w.close(); throw e }
}
const copia = t => navigator.clipboard.writeText(t).then(() => toast('Copiado ✓', 'ok'), () => toast('Não deu para copiar. Selecione e copie manualmente.', 'erro'));

/* ====================== janelas (modal) ====================== */
function modal(html, { aoAbrir } = {}) {
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'ov';
    o.innerHTML = `<div class="md" role="dialog" aria-modal="true">${html}</div>`;
    document.body.appendChild(o); document.body.classList.add('travado');
    const voltarFoco = document.activeElement;
    const fecha = v => {
      if (o._fechado) return; o._fechado = true; o.classList.add('saindo');
      setTimeout(() => { o.remove(); if (!$('.ov')) document.body.classList.remove('travado'); }, 150);
      try { voltarFoco && voltarFoco.focus({ preventScroll: true }) } catch {}
      o._aoFechar && o._aoFechar(); res(v);
    };
    o._fecha = fecha;
    o.addEventListener('mousedown', e => { if (e.target === o) fecha(null) });
    $$('[data-x]', o).forEach(b => b.addEventListener('click', () => fecha(null)));
    aoAbrir && aoAbrir(o, fecha);
  });
}
addEventListener('keydown', e => { if (e.key === 'Escape') { const o = $$('.ov:not(.saindo)').pop(); if (o) o._fecha(null) } });

function campo(c) {
  const id = 'f_' + c.id, ph = c.ph ? ` placeholder="${esc(c.ph)}"` : '', v = esc(c.value ?? '');
  const lab = c.type === 'check' ? '' : `<label class="f" for="${id}">${esc(c.label)}</label>`;
  let el;
  if (c.type === 'html') return c.html;
  if (c.type === 'select') el = `<select id="${id}">${c.opts.map(o => { const [val, txt] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(c.value ?? '') ? 'selected' : ''}>${esc(txt)}</option>` }).join('')}</select>`;
  else if (c.type === 'check') el = `<label class="check"><input type="checkbox" id="${id}" ${c.value ? 'checked' : ''}><span class="small muted">${esc(c.label)}</span></label>`;
  else if (c.type === 'textarea') el = `<textarea id="${id}"${ph} rows="3" maxlength="${c.max || 500}">${v}</textarea>`;
  else if (c.type === 'money') el = `<input id="${id}" data-money inputmode="numeric" autocomplete="off" value="${c.value != null && c.value !== '' ? esc(reais(c.value)) : ''}"${ph || ' placeholder="0,00"'}>`;
  else el = `<input id="${id}" type="${c.type || 'text'}" value="${v}"${ph} ${c.mode ? `inputmode="${c.mode}"` : ''} autocomplete="${c.auto || 'off'}" ${c.max ? `maxlength="${c.max}"` : ''}>`;
  return lab + el + (c.hint ? `<div class="hint">${esc(c.hint)}</div>` : '');
}
// valor em reais enquanto digita: "1" -> 0,01 ... "123456" -> 1.234,56
function mascaraMoeda(el) {
  const fmt = () => { const d = el.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 11); el.value = d ? (Number(d) / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2 }) : '' };
  el.addEventListener('input', fmt);
}
// formulário em janela. Se "enviar" falhar, a janela continua aberta e mostra o erro.
function form(titulo, campos, { ok = 'Salvar', sub = '', enviar, perigo = false } = {}) {
  const html = `<h3>${esc(titulo)}</h3>${sub ? `<div class="muted small" style="line-height:1.5">${sub}</div>` : ''}
    <form novalidate>${campos.map(campo).join('')}<div class="err small bad" role="alert"></div>
    <div class="acts"><button type="button" class="btn sec" data-x>Cancelar</button><button class="btn ${perigo ? 'danger' : ''}" type="submit">${esc(ok)}</button></div></form>`;
  return modal(html, { aoAbrir: (o, fecha) => {
    const f = $('form', o), err = $('.err', o), btn = $('button[type=submit]', f);
    $$('[data-money]', o).forEach(mascaraMoeda);
    setTimeout(() => { const el = $('input:not([type=checkbox]),select,textarea', o); if (el) { el.focus(); el.select && el.select() } }, 60);
    f.addEventListener('submit', async e => {
      e.preventDefault(); err.textContent = '';
      const v = {};
      for (const c of campos) { if (c.type === 'html') continue; const el = $('#f_' + c.id, o); v[c.id] = c.type === 'check' ? el.checked : el.value.trim() }
      const falta = campos.find(c => c.req && !v[c.id]);
      if (falta) { err.textContent = `Preencha: ${falta.label}`; $('#f_' + falta.id, o).focus(); return }
      if (!enviar) return fecha(v);
      btn.disabled = true; btn.classList.add('carregando');
      try { const r = await enviar(v); fecha(r === undefined ? v : r) }
      catch (x) { if (x.message !== 'auth') err.textContent = x.message; btn.disabled = false; btn.classList.remove('carregando') }
    });
  } });
}
function confirma(titulo, texto, { ok = 'Confirmar', perigo = false } = {}) {
  return modal(`<h3>${esc(titulo)}</h3><p class="muted" style="line-height:1.5">${texto}</p><div class="acts"><button class="btn sec" data-x>Cancelar</button><button class="btn ${perigo ? 'danger' : ''}" data-sim>${esc(ok)}</button></div>`,
    { aoAbrir: (o, fecha) => { const b = $('[data-sim]', o); b.onclick = () => fecha(true); setTimeout(() => b.focus(), 60) } }).then(v => !!v);
}

/* ====================== login ====================== */
function login(msg) {
  let modo = 'entrar';
  $('#root').innerHTML = `<div class="entra" style="max-width:400px;margin:8vh auto 0">
    <div class="brand" style="margin-bottom:18px"><div class="logo">C</div><div><h2>Caderneta</h2><div class="muted small">Fiado, promoções e Pix em um só lugar</div></div></div>
    <form class="card" id="fl" novalidate>
      <div class="tabs"><button type="button" class="on" data-m="entrar">Entrar</button><button type="button" data-m="criar">Criar conta</button></div>
      <div id="cnome" style="display:none"><label class="f" for="nm">Nome do mercado</label><input id="nm" placeholder="Ex.: Mercadinho do Zé" autocomplete="organization"></div>
      <label class="f" for="em">Email</label><input id="em" type="email" autocomplete="username" inputmode="email">
      <label class="f" for="se">Senha</label><input id="se" type="password" autocomplete="current-password">
      <button class="btn block" id="go" style="margin-top:16px">Entrar</button>
      <div id="lerr" class="small bad" role="alert" style="min-height:18px;margin-top:10px">${esc(msg || '')}</div>
      <button type="button" class="btn link" id="esq" style="display:block;margin:0 auto">Esqueci a senha</button>
    </form></div>`;
  const setModo = m => { modo = m; $$('[data-m]').forEach(b => b.className = b.dataset.m === m ? 'on' : ''); $('#cnome').style.display = m === 'criar' ? 'block' : 'none';
    $('#go').textContent = m === 'criar' ? 'Criar conta do mercado' : 'Entrar'; $('#se').autocomplete = m === 'criar' ? 'new-password' : 'current-password'; $('#lerr').textContent = ''; $(m === 'criar' ? '#nm' : '#em').focus() };
  $$('[data-m]').forEach(b => b.onclick = () => setModo(b.dataset.m));
  $('#esq').onclick = () => modal(`<h3>Esqueci a senha</h3><p class="muted" style="line-height:1.6">Se você é <b>caixa</b>, peça ao dono do mercado: em <i>Config → Equipe</i> ele redefine a sua senha.<br><br>Se você é o <b>dono</b>, fale com quem administra o sistema (suporte) para redefinir o acesso.</p><div class="acts"><button class="btn" data-x>Entendi</button></div>`);
  $('#fl').onsubmit = async e => {
    e.preventDefault(); const b = $('#go'); b.disabled = true; b.classList.add('carregando'); $('#lerr').textContent = '';
    try {
      const body = { email: $('#em').value.trim(), senha: $('#se').value, ...(modo === 'criar' ? { nome: $('#nm').value.trim() } : {}) };
      const r = await fetch(modo === 'criar' ? '/api/registro' : '/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.erro || 'Erro');
      S.tk = j.token; loc.set('tk', S.tk); await inicia();
    } catch (x) { $('#lerr').textContent = x.message === 'Failed to fetch' ? 'Sem conexão.' : x.message; b.disabled = false; b.classList.remove('carregando') }
  };
  setTimeout(() => $('#em').focus(), 50);
}
function sairLocal(msg) { S.tk = null; S.eu = null; loc.set('tk', null); $$('.ov').forEach(o => o.remove()); document.body.classList.remove('travado'); history.replaceState(null, '', '/painel'); login(msg) }

/* ====================== casca + rotas ====================== */
const ABAS = [
  ['clientes', 'Clientes'], ['comprovantes', 'Comprovantes', 'comprovantes'], ['avisos', 'Avisos', 'avisos'], ['promocoes', 'Promoções'],
  ['validade', 'Validade', 'validade'], ['produtos', 'Produtos'], ['relatorios', 'Relatórios', null, true], ['config', 'Config'],
];
async function inicia() {
  try { [S.eu, S.mercado] = await Promise.all([api('/eu'), api('/mercado')]) } catch (e) { if (e.message !== 'auth') login(e.message); return }
  $('#root').innerHTML = `<header class="topo np"><div class="brand"><div class="logo">${esc(ini(S.mercado.nome))}</div><div><b id="mnome">${esc(S.mercado.nome)}</b>
      <div class="who muted tiny">${esc(S.eu.nome)} <span class="papel">${dono() ? 'dono' : 'caixa'}</span></div></div></div>
      <button class="btn sec sm" data-a="sair">Sair</button></header>
    <nav class="nav np" id="nav" aria-label="Seções"></nav><main id="v"></main>`;
  pintaNav(); contadores(); rota();
}
// a barra de abas é criada uma vez; depois só mudam a aba ativa e os números (não perde a rolagem)
function pintaNav() {
  const nav = $('#nav'); if (!nav) return;
  const atual = (location.hash.replace(/^#\/?/, '').split('/')[0]) || 'clientes';
  if (!nav.children.length) nav.innerHTML = ABAS.filter(a => !a[3] || dono()).map(([k, n]) => `<a href="#/${k}" data-aba="${k}">${n}<span class="badge" hidden></span></a>`).join('');
  for (const a of nav.children) {
    const on = a.dataset.aba === atual, c = ABAS.find(x => x[0] === a.dataset.aba)[2], b = a.querySelector('.badge');
    a.classList.toggle('on', on); on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
    b.hidden = !(c && S.cont[c]); b.textContent = c ? S.cont[c] || '' : '';
    if (on && (a.offsetLeft < nav.scrollLeft || a.offsetLeft + a.offsetWidth > nav.scrollLeft + nav.clientWidth)) nav.scrollLeft = a.offsetLeft - 16;
  }
}
async function contadores() { try { S.cont = await api('/contadores'); if ($('#nav')) pintaNav() } catch {} }
setInterval(() => { if (S.tk && document.visibilityState === 'visible') contadores() }, 45000);
document.addEventListener('visibilitychange', () => { if (S.tk && document.visibilityState === 'visible') contadores() });
addEventListener('online', () => $('#offline').classList.remove('on')); addEventListener('offline', () => $('#offline').classList.add('on'));

let seq = 0;
const esqueleto = () => `<div class="card"><div class="sk" style="width:40%"></div><div class="sk" style="width:75%;margin-top:14px"></div><div class="sk" style="width:60%;margin-top:14px"></div></div>`;
// troca de tela: só mostra "carregando" se demorar; quando o usuário já navegou para outra tela, descarta a resposta velha
async function rota({ suave = false } = {}) {
  if (!S.tk || !S.eu) return;
  const [aba, arg] = location.hash.replace(/^#\/?/, '').split('/');
  const nome = VIEWS[aba] && (!ABAS.find(a => a[0] === aba)?.[3] || dono()) ? aba : 'clientes';
  if (nome !== aba && aba) { history.replaceState(null, '', '#/' + nome); return rota() }
  pintaNav();
  const meu = ++seq, v = $('#v'), y = scrollY;
  const t = suave ? null : setTimeout(() => { if (meu === seq) v.innerHTML = esqueleto() }, 160);
  try {
    const view = VIEWS[nome];
    const dados = await view.carrega(arg);
    if (meu !== seq) return;
    clearTimeout(t);
    v.innerHTML = view.html(dados, arg);
    if (!suave) { v.classList.remove('entra'); void v.offsetWidth; v.classList.add('entra'); scrollTo({ top: 0, behavior: 'instant' }) } else scrollTo({ top: y, behavior: 'instant' });
    view.liga && view.liga(dados, arg);
  } catch (e) {
    clearTimeout(t);
    if (e.message !== 'auth' && meu === seq) v.innerHTML = `<div class="card empty"><b>⚠️</b>${esc(e.message)}<br><button class="btn sec sm" style="margin-top:12px" data-a="recarregar">Tentar de novo</button></div>`;
  }
}
const atualiza = () => { contadores(); return rota({ suave: true }) };
addEventListener('hashchange', () => rota());

// cliques: [data-a] chama uma ação; [data-href] navega
document.addEventListener('click', e => {
  const a = e.target.closest('[data-a]');
  if (a) { e.preventDefault(); e.stopPropagation(); const fn = ACOES[a.dataset.a]; if (fn) run(() => fn(a.dataset, a)); return }
  const h = e.target.closest('[data-href]'); if (h) location.hash = h.dataset.href;
});
document.addEventListener('keydown', e => {
  const h = e.target.closest?.('[data-href]'); if (h && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); location.hash = h.dataset.href }
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && $('#bq')) { e.preventDefault(); $('#bq').focus() }
});

/* ====================== telas ====================== */
const vazio = (emoji, txt) => `<div class="empty"><b>${emoji}</b>${txt}</div>`;
const secao = (titulo, botao = '') => `<div class="sec-h"><div class="cap">${titulo}</div>${botao}</div>`;
const VIEWS = {};

/* ---------- clientes ---------- */
async function buscaClientes(offset = 0) {
  const p = new URLSearchParams({ q: S.cl.q, limit: 50, offset });
  if (S.cl.filtro === 'devendo') p.set('devendo', '1'); if (S.cl.filtro === 'arquivados') p.set('arquivados', '1');
  const r = await api('/clientes?' + p, { raw: true });
  const itens = await r.json();
  S.cl.total = Number(r.headers.get('x-total-count') || itens.length);
  S.cl.itens = offset ? S.cl.itens.concat(itens) : itens;
}
const linhaCliente = c => `<div class="it click" data-href="/clientes/${c.id}" tabindex="0" role="link">
  <div class="av">${esc(ini(c.nome))}</div>
  <div class="main"><div class="t">${esc(c.nome)}</div><div class="s">${esc(c.telefone || 'sem telefone')}${c.ativado_em ? ' · <span class="ok">app ativo</span>' : ''}${c.dia_vencimento ? ` · vence dia ${c.dia_vencimento}` : ''}</div></div>
  <div class="amt ${c.saldo > 0 ? 'bad' : 'ok'}">${brl(c.saldo)}</div>
  ${c.ativo ? `<button class="btn sec ico np" data-a="compra" data-id="${c.id}" data-nome="${esc(c.nome)}" title="Lançar compra fiada" aria-label="Lançar compra para ${esc(c.nome)}">+</button>` : ''}</div>`;
function pintaLista() {
  const L = $('#lista'); if (!L) return;
  const { itens, total, q, filtro } = S.cl;
  L.innerHTML = itens.length ? itens.map(linhaCliente).join('') : vazio('📒', q ? 'Nenhum cliente encontrado.' : filtro === 'devendo' ? 'Ninguém devendo. 🎉' : filtro === 'arquivados' ? 'Nenhum cliente arquivado.' : 'Nenhum cliente ainda. Toque em “+ Novo”.');
  $('#cnt').textContent = itens.length ? `${itens.length < total ? `${itens.length} de ` : ''}${plural(total, 'cliente', 'clientes')}` : '';
  $('#mais').style.display = itens.length < total ? '' : 'none';
}
VIEWS.clientes = {
  carrega: async arg => arg ? VIEWS.extrato.carrega(arg) : Promise.all([api('/resumo'), buscaClientes()]).then(([r]) => r),
  html: (r, arg) => arg ? VIEWS.extrato.html(r) : `
    <div class="hero"><div class="lbl">Total a receber (fiado em aberto)</div><div class="val ${r.total_a_receber > 0 ? 'bad' : 'ok'}">${brl(r.total_a_receber)}</div>
      <div class="linha"><span><b>${r.clientes_devendo}</b> devendo</span><span>recebido hoje <b class="ok">${brl(r.recebido_hoje)}</b></span></div></div>
    <div class="stat" style="margin-top:12px"><div class="card"><div class="lbl">Fiado no mês</div><div class="val">${brl(r.fiado_no_mes)}</div></div>
      <div class="card"><div class="lbl">Recebido no mês</div><div class="val ok">${brl(r.recebido_no_mes)}</div></div></div>
    ${secao('Clientes')}
    <div class="barra"><div class="busca"><input id="bq" type="search" placeholder="Buscar por nome ou telefone…  ( / )" value="${esc(S.cl.q)}" autocomplete="off" aria-label="Buscar cliente"></div><button class="btn" data-a="novoCliente">+ Novo</button></div>
    <div class="filtros" role="group" aria-label="Filtro">${[['', 'Todos'], ['devendo', 'Devendo'], ['arquivados', 'Arquivados']].map(([k, n]) => `<button data-a="filtro" data-f="${k}" class="${S.cl.filtro === k ? 'on' : ''}">${n}</button>`).join('')}</div>
    <div class="card list" id="lista" style="margin-top:12px"></div><div class="contagem" id="cnt"></div>
    <button class="btn sec sm mais" id="mais" data-a="maisClientes">Carregar mais</button>`,
  liga: (r, arg) => {
    if (arg) return;
    pintaLista();
    let t; $('#bq').addEventListener('input', e => { clearTimeout(t); S.cl.q = e.target.value; t = setTimeout(() => run(async () => { await buscaClientes(); pintaLista() }), 220) });
  },
};

/* ---------- ficha / extrato do cliente ---------- */
const TIPO = { compra: 'Compra fiada', pagamento: 'Pagamento', ajuste: 'Ajuste' };
const linhaLanc = l => `<div class="it ${l.estornado ? 'estornado' : ''}" id="l${l.id}"><div class="main">
    <div class="t">${l.estorno_de ? 'Estorno' : TIPO[l.tipo]} ${l.contestado ? '<span class="chip bad">contestado</span>' : ''}${l.estornado ? ' <span class="chip">estornado</span>' : ''}</div>
    <div class="s">${dt(l.criado_em)}${l.descricao ? ' · ' + esc(l.descricao) : ''}${l.forma ? ' · ' + esc(l.forma) : ''}${l.usuario ? ` · <span class="quem">por ${esc(l.usuario)}</span>` : ''}</div></div>

  },
  pagto: async () => {
    const id = idSel(), s = S.ext.saldo;
    const r = await form('Receber pagamento', [{ id: 'valor', label: 'Valor recebido', type: 'money', value: s > 0 ? s : '', req: true },
      { id: 'forma', label: 'Forma', type: 'select', opts: [['pix', 'Pix'], ['dinheiro', 'Dinheiro'], ['cartão', 'Cartão'], ['outro', 'Outro']], value: 'pix' }],
      { ok: 'Registrar', sub: s > 0 ? `Saldo atual: <b>${brl(s)}</b>` : '', enviar: v => api(`/clientes/${id}/pagamentos`, { method: 'POST', body: v }) });
    if (r) { vibra(); toast(r.saldo <= 0 ? 'Pagamento registrado · conta quitada 🎉' : `Pagamento registrado · falta ${brl(r.saldo)}`, 'ok'); await atualiza(); $('#l' + r.id)?.classList.add('pisca') }
  },
  estorna: async d => {
    const r = await form('Estornar lançamento', [{ id: 'motivo', label: 'Motivo', ph: 'Ex.: valor digitado errado', max: 150 }],
      { ok: 'Estornar', perigo: true, sub: 'Cria um lançamento inverso. O histórico não é apagado.', enviar: v => api(`/lancamentos/${d.id}/estornar`, { method: 'POST', body: v }) });
    if (r) { toast('Estornado ✓', 'ok'); atualiza() }

  cobrar: async () => { await abreWa(async () => (await api(`/clientes/${idSel()}/cobrar`, { method: 'POST' })).link_wa) },
  novoLink: async () => {
    if (!await confirma('Gerar novo link', 'O link antigo deixa de funcionar e o cliente sai do app nos aparelhos dele (entra de novo com telefone e PIN).', { ok: 'Gerar', perigo: true })) return;
    const r = await api(`/clientes/${idSel()}/novo-link`, { method: 'POST' });
    S.ext.cliente.url = r.url;
    await modal(`<h3>Novo link</h3><p class="muted small" style="word-break:break-all">${esc(r.url)}</p><div class="acts"><button class="btn sec" data-x>Fechar</button><button class="btn" data-a="copiaTxt" data-t="${esc(r.url)}">Copiar</button></div>`);

  editaCliente: async () => {
    const c = S.ext.cliente;
    const r = await form('Editar cliente', [{ id: 'nome', label: 'Nome', value: c.nome, req: true, max: 80 }, { id: 'telefone', label: 'WhatsApp (com DDD)', value: c.telefone || '', type: 'tel', mode: 'tel' },
      ...(dono() ? [{ id: 'limite', label: 'Limite de fiado (R$)', type: 'money', value: c.limite || '', hint: 'Vazio = sem limite.' },
        { id: 'dia_vencimento', label: 'Dia de vencimento da conta', type: 'select', value: c.dia_vencimento || '', opts: [['', 'Sem dia fixo'], ...Array.from({ length: 28 }, (_, i) => [i + 1, `Todo dia ${i + 1}`])], hint: 'O cliente vê a data no app e recebe lembrete 3 dias antes e no dia.' },
        { type: 'html', html: `<button type="button" class="btn link bad" data-a="arquivar" data-v="0" style="margin-top:14px">Arquivar cliente</button>` }] : [])],
      { enviar: v => api(`/clientes/${c.id}`, { method: 'PATCH', body: v }) });

  arquivar: async d => {

    if (!ativo && !await confirma('Arquivar cliente', 'O cliente some da lista e o link/app dele param de funcionar. O histórico fica guardado e você pode reativar depois.', { ok: 'Arquivar', perigo: true })) return;
    await api(`/clientes/${idSel()}`, { method: 'PATCH', body: { ativo } });

  convite: async () => {
    const r = await api(`/clientes/${idSel()}/codigo-acesso`, { method: 'POST' });

      <div class="hint" style="text-align:center;word-break:break-all">Endereço: ${esc(r.url_app)}</div><div class="acts" style="flex-direction:column">
      <a class="btn good" href="${esc(r.link_wa)}" target="_blank" rel="noopener">Enviar convite pelo WhatsApp</a><button class="btn sec" data-a="copiaTxt" data-t="${esc(r.codigo)}">Copiar código</button><button class="btn sec" data-x>Fechar</button></div>`);

  verComp: async d => {
    const r = await api(`/pagamentos-informados/${d.id}/comprovante`, { raw: true }); const url = URL.createObjectURL(await r.blob());
    await modal(`<h3>Comprovante</h3><img src="${url}" alt="Comprovante enviado pelo cliente" style="width:100%;border-radius:12px;margin-top:10px"><div class="acts"><button class="btn sec" data-x>Fechar</button></div>`);

    const r = await form('Confirmar pagamento', [{ id: 'valor', label: 'Valor a abater', type: 'money', value: Number(d.v), hint: 'Confira no app do banco. Corrija se o cliente digitou errado.' }],

  editaPromo: d => promoForm(S.promos.find(p => p.id === Number(d.id))),
  togglePromo: async d => { await api(`/promocoes/${d.id}`, { method: 'PATCH', body: { ativo: d.v === '1' } }); atualiza() },
  excluiPromo: async d => {
    if (!await confirma('Excluir promoção', 'Ela some do app dos clientes.', { ok: 'Excluir', perigo: true })) return;
    await api(`/promocoes/${d.id}`, { method: 'DELETE' }); $$('.ov').forEach(o => o._fecha(null)); toast('Promoção excluída'); atualiza();
  },

  baixa: async d => { await api(`/entradas/${d.id}/baixar`, { method: 'POST' }); toast('Baixa registrada ✓', 'ok'); some('#e' + d.id); some('#le' + d.id); contadores() },
  novoProd: async (d = {}) => {
    const r = await form('Novo produto', [{ id: 'nome', label: 'Nome', req: true, max: 80 }, { id: 'codigo', label: 'Código de barras (opcional)', value: d.codigo || '', mode: 'numeric', max: 40 },
      { id: 'alerta_dias', label: 'Avisar quantos dias antes de vencer?', value: '7', mode: 'numeric', max: 3 }],
      { ok: 'Cadastrar', enviar: v => api('/produtos', { method: 'POST', body: v }) });
    if (r) { toast('Produto cadastrado ✓', 'ok'); await atualiza(); ACOES.entrada({ id: r.id }) }
  },
  entrada: async d => {
    const r = await form('Entrada de mercadoria', [{ id: 'quantidade', label: 'Quantidade', mode: 'numeric', req: true, max: 7 }, { id: 'validade', label: 'Validade', type: 'date', req: true },
      { id: 'custo', label: 'Custo unitário (opcional)', type: 'money' }],
      { ok: 'Registrar', enviar: v => api(`/produtos/${d.id}/entradas`, { method: 'POST', body: { ...v, quantidade: Number(v.quantidade) } }) });
    if (r) { toast('Entrada registrada ✓', 'ok'); $$('.ov').forEach(o => o._fecha(null)); atualiza() }

  abreProduto: async d => {
    const p = S.prod.itens.find(x => x.id === Number(d.id)); const lotes = await api(`/produtos/${d.id}/entradas`);
    await modal(`<h3>${esc(p.nome)}</h3><div class="muted small">${p.codigo ? 'Código ' + esc(p.codigo) + ' · ' : ''}avisar ${p.alerta_dias} dias antes</div>
      <div class="list" style="margin-top:10px">${lotes.map(l => `<div class="it" id="le${l.id}"><div class="main"><div class="t">×${l.quantidade}</div><div class="s">vence ${dataBR(l.validade)}${l.custo ? ` · custo ${brl(l.custo)}` : ''}</div></div>${chipDias(l.dias_restantes)}<button class="btn sec sm" data-a="baixa" data-id="${l.id}">Baixa</button></div>`).join('') || vazio('', 'Nenhum lote em estoque.')}</div>
      <div class="acts" style="flex-wrap:wrap"><button class="btn" data-a="entrada" data-id="${p.id}">+ Entrada</button><button class="btn sec" data-a="editaProd" data-id="${p.id}">Editar</button>${dono() ? `<button class="btn danger" data-a="excluiProd" data-id="${p.id}">Excluir</button>` : ''}<button class="btn sec" data-x>Fechar</button></div>`);
  },
  editaProd: async d => {
    const p = S.prod.itens.find(x => x.id === Number(d.id));
    const r = await form('Editar produto', [{ id: 'nome', label: 'Nome', value: p.nome, req: true, max: 80 }, { id: 'codigo', label: 'Código de barras', value: p.codigo || '', mode: 'numeric', max: 40 },
      { id: 'alerta_dias', label: 'Avisar quantos dias antes de vencer?', value: String(p.alerta_dias), mode: 'numeric', max: 3 }],
      { enviar: v => api(`/produtos/${p.id}`, { method: 'PATCH', body: v }) });
    if (r) { toast('Salvo ✓', 'ok'); $$('.ov').forEach(o => o._fecha(null)); atualiza() }
  },
  excluiProd: async d => {
    if (!await confirma('Excluir produto', 'O produto e todos os lotes dele serão apagados.', { ok: 'Excluir', perigo: true })) return;
    await api(`/produtos/${d.id}`, { method: 'DELETE' }); $$('.ov').forEach(o => o._fecha(null)); toast('Produto excluído'); atualiza();

  scan: () => scanner(),

  exporta: async (d, b) => { b.classList.add('carregando'); try { await baixa(d.p) } finally { b.classList.remove('carregando') } },
  exportaLanc: async () => {
    const h = hojeLocal(), ini = h.slice(0, 8) + '01';
    const v = await form('Exportar lançamentos', [{ id: 'de', label: 'De', type: 'date', value: ini }, { id: 'ate', label: 'Até', type: 'date', value: h }], { ok: 'Baixar' });
    if (v) await baixa(`/export/lancamentos.csv?de=${encodeURIComponent(v.de)}&ate=${encodeURIComponent(v.ate)}`);
  },
  maisAud: async (d, b) => {
    b.classList.add('carregando');
    try { const r = await api('/auditoria?antes=' + S.audUlt); $('#aud').insertAdjacentHTML('beforeend', r.itens.map(linhaAud).join('')); S.audUlt = r.itens.at(-1)?.id; b.style.display = r.tem_mais ? '' : 'none' } finally { b.classList.remove('carregando') }
  },

  verQr: async () => { const r = await api('/mercado/qr', { raw: true }); const u = URL.createObjectURL(await r.blob());
    $('#qrbox').innerHTML = `<div style="background:#fff;display:inline-block;padding:10px;border-radius:14px"><img src="${u}" width="240" height="240" alt="QR code do app do mercado"></div><div class="hint">O cliente aponta a câmera e abre o app do mercado.</div>` },
  novoCaixa: async () => {
    const r = await form('Novo acesso de caixa', [{ id: 'nome', label: 'Nome', req: true, max: 80 }, { id: 'email', label: 'Email', type: 'email', mode: 'email', req: true }, { id: 'senha', label: 'Senha inicial (mín. 8)', type: 'password', auto: 'new-password', req: true }],

  ativaCaixa: async d => {

    if (!ativo && !await confirma('Desativar acesso', `${esc(d.nome)} perde o acesso na hora.`, { ok: 'Desativar', perigo: true })) return;
    await api(`/equipe/${d.id}`, { method: 'PATCH', body: { ativo } }); toast(ativo ? 'Acesso reativado' : 'Acesso desativado', 'ok'); atualiza();
  },
  trocaSenha: async () => {
    const r = await form('Trocar senha', [{ id: 'atual', label: 'Senha atual', type: 'password', auto: 'current-password', req: true }, { id: 'nova', label: 'Nova senha (mín. 8)', type: 'password', auto: 'new-password', req: true }],

    if (r) { S.tk = r.token; loc.set('tk', S.tk); toast('Senha trocada ✓', 'ok') }
  },
  sairTodos: async () => {
    if (!await confirma('Sair de todos os aparelhos', 'Você e qualquer aparelho conectado com a sua conta vão precisar entrar de novo.', { ok: 'Sair de todos', perigo: true })) return;
    await api('/eu/sair-de-todos', { method: 'POST' }); sairLocal('Você saiu de todos os aparelhos.');

// remove uma linha com animação e atualiza os contadores
function some(sel) { const el = $(sel); if (!el) return; el.classList.add('sai'); setTimeout(() => { const lista = el.parentElement; el.remove(); if (lista && !lista.children.length) atualiza() }, 260); contadores() }

async function promoForm(p) {
  const r = await form(p ? 'Editar promoção' : 'Nova promoção', [{ id: 'titulo', label: 'Produto / título', ph: 'Arroz 5kg', value: p?.titulo, req: true, max: 80 },
    { type: 'html', html: '<div class="dupla">' }, { id: 'preco', label: 'Preço promocional', type: 'money', value: p?.preco ?? '' }, { id: 'preco_original', label: 'Preço normal (opcional)', type: 'money', value: p?.preco_original ?? '' }, { type: 'html', html: '</div>' },
    { id: 'validade', label: 'Válida até (opcional)', type: 'date', value: p?.validade || '' }, { id: 'descricao', label: 'Descrição (opcional)', ph: 'Só até acabar o estoque', value: p?.descricao || '', max: 300 },
    ...(p ? [{ type: 'html', html: `<button type="button" class="btn link bad" data-a="excluiPromo" data-id="${p.id}" style="margin-top:14px">Excluir promoção</button>` }] : [])],
    { ok: p ? 'Salvar' : 'Publicar', enviar: v => p ? api(`/promocoes/${p.id}`, { method: 'PATCH', body: v }) : api('/promocoes', { method: 'POST', body: v }) });
  if (r) { toast(p ? 'Promoção salva ✓' : 'Promoção publicada ✓', 'ok'); atualiza() }
}

// leitor de código de barras pela câmera (Chrome no Android). Achou o produto: abre; não achou: oferece cadastrar.
async function scanner() {
  let stream, parar = false;
  const fechou = modal(`<h3>Ler código de barras</h3><div class="muted small">Aponte a câmera para o código.</div><div class="scan"><video playsinline muted></video></div><div class="acts"><button class="btn sec" data-x>Cancelar</button></div>`, {
    aoAbrir: async (o, fecha) => {
      o._aoFechar = () => { parar = true; stream && stream.getTracks().forEach(t => t.stop()) };
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const v = $('video', o); v.srcObject = stream; await v.play();
        const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39'] });
        while (!parar) { const r = await det.detect(v).catch(() => []); if (r[0]) { vibra(); return fecha(r[0].rawValue) } await new Promise(z => setTimeout(z, 200)) }
      } catch { toast('Não foi possível usar a câmera. Digite o código na busca.', 'erro'); fecha(null) }
    } });
  const codigo = await fechou; if (!codigo) return;
  const p = (S.prod.itens || []).find(x => x.codigo === codigo);
  if (p) return ACOES.abreProduto({ id: p.id });
  if (await confirma('Produto não cadastrado', `Código <b>${esc(codigo)}</b>. Cadastrar agora?`, { ok: 'Cadastrar' })) ACOES.novoProd({ codigo });
}

if (!navigator.onLine) $('#offline').classList.add('on');
S.tk ? inicia() : login();
</script>
